[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pysurveying"
version = "0.1.0"
description = "A lightweight Python toolkit for surveying computation, adjustment, quality control and visualization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jinghao Hu" }]
keywords = ["surveying", "geodesy", "adjustment", "least-squares", "traverse", "leveling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyproj>=3.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
pysurveying-ui = "pysurveying.ui:main"

[project.urls]
Repository = "https://github.com/hujinghaoabcd/pySurveying"

[tool.hatch.build.targets.wheel]
packages = ["src/pysurveying"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
