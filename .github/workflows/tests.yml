name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    name: Python 3.12 diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run and report diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          : > ci-diagnostic.log

          python -m pip install --upgrade pip 2>&1 | tee -a ci-diagnostic.log
          python -m pip install -e ".[dev,ui]" 2>&1 | tee -a ci-diagnostic.log
          install_code=${PIPESTATUS[0]}

          import_code=99
          compile_code=99
          test_code=99
          ruff_code=99
          build_code=99

          if [ "$install_code" -eq 0 ]; then
            echo '\n## Import' | tee -a ci-diagnostic.log
            python -c "import pysurveying; print('pySurveying', pysurveying.__version__)" 2>&1 | tee -a ci-diagnostic.log
            import_code=${PIPESTATUS[0]}

            echo '\n## Compile UI and examples' | tee -a ci-diagnostic.log
            python -m compileall -q src/pysurveying examples 2>&1 | tee -a ci-diagnostic.log
            compile_code=${PIPESTATUS[0]}

            echo '\n## Pytest' | tee -a ci-diagnostic.log
            python -m pytest -vv 2>&1 | tee -a ci-diagnostic.log
            test_code=${PIPESTATUS[0]}

            echo '\n## Ruff' | tee -a ci-diagnostic.log
            python -m ruff check src tests examples 2>&1 | tee -a ci-diagnostic.log
            ruff_code=${PIPESTATUS[0]}

            echo '\n## Build' | tee -a ci-diagnostic.log
            python -m build 2>&1 | tee -a ci-diagnostic.log
            build_code=${PIPESTATUS[0]}
          fi

          summary="install=$install_code import=$import_code compile=$compile_code pytest=$test_code ruff=$ruff_code build=$build_code"
          echo "$summary" | tee -a ci-diagnostic.log

          body_file=$(mktemp)
          {
            echo "Automated mixed-network quality diagnostic for commit $GITHUB_SHA."
            echo
            echo '```text'
            tail -n 320 ci-diagnostic.log
            echo '```'
          } > "$body_file"
          gh issue create --title "CI diagnostic: ${GITHUB_SHA::7}" --body-file "$body_file" || true

          if [ "$install_code" -ne 0 ] || [ "$import_code" -ne 0 ] || [ "$compile_code" -ne 0 ] || [ "$test_code" -ne 0 ] || [ "$ruff_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then
            exit 1
          fi
