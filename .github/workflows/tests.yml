name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"

      - name: Import smoke test
        run: python -c "import pysurveying; print('pySurveying', pysurveying.__version__)"

      - name: Compile UI and examples
        run: python -m compileall -q src/pysurveying examples

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check src tests examples

      - name: Build distributions
        run: python -m build

      - name: Check PyPI metadata and README rendering
        run: python -m twine check dist/*
